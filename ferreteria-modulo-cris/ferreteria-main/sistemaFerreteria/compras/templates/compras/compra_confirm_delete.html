
<!DOCTYPE html>
<html>
<head><title>Eliminar compra</title></head>
<body>
  <h1>Eliminar compra {{ compra.numero_compra }}</h1>
  <p>¿Estás seguro de eliminar esta compra? También se revertirán los movimientos de inventario asociados.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
  </form>
  <p><a href="{% url 'compras:compra_detail' compra.pk %}">Cancelar</a></p>
</body>
</html>
